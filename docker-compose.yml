services:
  mysql:
    image: mysql:8.0
    container_name: filevault-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: file_vault
      MYSQL_USER: file_vault
      MYSQL_PASSWORD: file_vault
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - filevault-net
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - minio-net
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - filevault-net
  app:
    build: .
    container_name: filevault-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - minio
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/file_vault
      SPRING_DATASOURCE_USERNAME: file_vault
      SPRING_DATASOURCE_PASSWORD: file_vault
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_SQL_INIT_MODE: never
    networks:
      - filevault-net

volumes:
  mysql_data:
  minio_data:
  redis_data:

networks:
  filevault-net: # 👈 define custom bridge network
    driver: bridge
  minio-net:
    driver: bridge