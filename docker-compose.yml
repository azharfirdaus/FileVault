services:
  mysql:
    image: mysql:8.0
    container_name: filevault-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: file_vault
      MYSQL_USER: file_vault
      MYSQL_PASSWORD: file_vault
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - filevault-net
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - minio-net

volumes:
  mysql_data:
  minio_data:

networks:
  filevault-net: # 👈 define custom bridge network
    driver: bridge
  minio-net:
    driver: bridge