server.port=8080

logging.level.root=INFO
logging.level.com.file.vault=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc.datasource.init=DEBUG

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

file.upload.max-size-bytes=20971520
file.upload.allowed-extensions=pdf,png,jpg,jpeg

spring.datasource.url=jdbc:mysql://localhost:3306/file_vault?useSSL=true&serverTimezone=UTC
spring.datasource.username=file_vault
spring.datasource.password=file_vault
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin123
minio.bucket=file-vault
minio.region=ap-southeast-3